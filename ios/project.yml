# XcodeGen spec for the stems iOS app. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen
name: Stems
options:
  bundleIdPrefix: io.github.edwin580
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Stems:
    type: application
    platform: iOS
    sources: [Stems]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.edwin580.stems
        PRODUCT_NAME: Stems
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Set your Apple team here (or in Xcode under Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
    info:
      path: Stems/Info.plist
      properties:
        CFBundleDisplayName: stems
        # The web app the shell loads. PR previews live under /stems/previews/.
        StemsStartURL: https://edwin580.github.io/stems/
        # Service workers (offline use, shared memory) only run on app-bound domains.
        WKAppBoundDomains: [edwin580.github.io]
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # "Open in stems" for audio from Files, Mail, AirDrop and other apps' share menus.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
        ITSAppUsesNonExemptEncryption: false
