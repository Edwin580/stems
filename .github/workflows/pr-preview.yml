name: PR preview

# Builds every PR and publishes it to main:/docs/previews/pr-<number>/, which
# GitHub Pages (source: main /docs) serves. Removed again when the PR closes.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # Forks get a read-only token and can't write main; skip them.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pr/package-lock.json
      - name: Build
        working-directory: pr
        run: |
          npm ci
          npm run build
      - name: Publish preview
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pr/scripts/publish-docs.sh site "$GITHUB_WORKSPACE/pr/dist" "previews/pr-${{ github.event.number }}" \
            "Preview for #${{ github.event.number }} @ ${PR_SHA::7}"
      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            let base = `https://${owner.toLowerCase()}.github.io/${repo}/`;
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              if (data.html_url) base = data.html_url.endsWith('/') ? data.html_url : data.html_url + '/';
            } catch { /* Pages API needs extra scopes; the default URL is fine */ }
            const url = `${base}previews/pr-${n}/`;
            const marker = '<!-- stems-pr-preview -->';
            const body = `${marker}\n🔎 **Preview:** ${url}\n\nBuilt from ${sha}. GitHub Pages usually publishes it within a minute or two of this comment.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: n, body });

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          sparse-checkout: scripts
      - name: Remove preview
        run: pr/scripts/publish-docs.sh site - "previews/pr-${{ github.event.number }}" "Remove preview for #${{ github.event.number }}"
