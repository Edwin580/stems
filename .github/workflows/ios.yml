name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: ios
      - name: Build for the simulator (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Stems.xcodeproj -scheme Stems -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          # A delegate method that only "nearly matches" its protocol compiles but is never called.
          if grep -q "nearly matches" build.log; then grep "nearly matches" build.log; exit 1; fi
